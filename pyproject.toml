[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py_autowired"
version = "0.5.1"
description = "Runtime dependency injection without imports between your classes: self.x_instance = None"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayhan Öztemel" }]
license = "MIT"
keywords = ["dependency-injection", "autowiring", "fastapi", "flask", "django", "ioc", "runtime-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AyhanOztemel/py-autowired"
Repository = "https://github.com/AyhanOztemel/py-autowired"
Documentation = "https://github.com/AyhanOztemel/py-autowired#readme"
Issues = "https://github.com/AyhanOztemel/py-autowired/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
dev = ["build>=1.2", "pytest>=8", "twine>=6"]
examples = [
  "django>=5.1",
  "fastapi>=0.115",
  "flask>=3.1",
  "httpx2>=2.0",
  "uvicorn>=0.30",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_autowired*"]
namespaces = true

[tool.setuptools.package-data]
py_autowired = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.mutmut]
paths_to_mutate = ["src/py_autowired/autowired.py", "src/py_autowired/container.py"]
tests_dir = ["tests/"]
also_copy = [
  "src/py_autowired/__init__.py",
  "src/py_autowired/fastapi.py",
  "src/py_autowired/flask.py",
  "src/py_autowired/django.py",
  "src/py_autowired/_web.py",
  "src/py_autowired/py.typed",
  "examples/",
  "README.md",
  "USAGE_GUIDE_EN.md",
  "KULLANIM_KILAVUZU_TR.md",
]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
